[env:weact_f405]
platform = ststm32
board = genericSTM32F405RGT6
framework = arduino

; 168 MHz Cortex-M4F
board_build.f_cpu = 168000000L

; USB serial for debug (optional — remove StartLog(true) to skip)
build_flags =
    -DNAM_SAMPLE_FLOAT
    -DNAM_USE_INLINE_GEMM
    -D__ARM_ARCH_7EM__
    -DSTM32F4xx
    -O3
    -fexceptions
    -ffast-math
    -funroll-loops
    -ftree-vectorize
    -fmove-loop-invariants
    -std=gnu++17
    ; Include paths for NAM and namb
    -I../NeuralAmpModelerCore
    -I../NeuralAmpModelerCore/Dependencies/eigen
    -I../NeuralAmpModelerCore/Dependencies/nlohmann
    -I../nam-binary-loader

lib_deps =
    olikraus/U8g2@^2.34.0

; Pull NAM sources in via extra_scripts
extra_scripts = extra_script.py

[env:weact_f405_release]
extends = env:weact_f405
build_flags =
    ${env:weact_f405.build_flags}
    -DNDEBUG
